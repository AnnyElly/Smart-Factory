<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Factory</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f2f4f7; margin: 0;
           display: flex; justify-content: center; padding-top: 60px; }
    .card { background: #fff; padding: 32px 40px; border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,.12); min-width: 320px; text-align: center; }
    h1 { margin-top: 0; font-size: 22px; }
    .valor { font-size: 20px; margin: 12px 0; }
    .estado { display: inline-block; padding: 8px 24px; border-radius: 20px;
              font-weight: bold; font-size: 20px; color: #fff; background: #888; margin: 12px 0; }
    .NORMAL { background: #2e9e4f; }
    .ALERTA { background: #d93025; }
    button { padding: 10px 28px; font-size: 16px; cursor: pointer; border-radius: 6px;
             border: none; background: #1a73e8; color: #fff; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Smart Factory - Monitoramento</h1>
    <div class="valor">Temperatura: <strong id="temp">--</strong></div>
    <div class="valor">Umidade: <strong id="umid">--</strong></div>
    <div id="estado" class="estado">Aguardando dados</div><br>
    <button onclick="atualizar()">Atualizar</button>
  </div>

  <script>
    async function atualizar() {
      const estadoEl = document.getElementById("estado");
      try {
        const r = await fetch("/leitura");
        const d = await r.json();
        if (d.disponivel) {
          document.getElementById("temp").textContent = d.temperatura.toFixed(1) + " °C";
          document.getElementById("umid").textContent = d.umidade.toFixed(1) + " %";
          estadoEl.textContent = d.estado;
          estadoEl.className = "estado " + d.estado;
          return;
        }
      } catch (e) {}
      document.getElementById("temp").textContent = "--";
      document.getElementById("umid").textContent = "--";
      estadoEl.textContent = "Aguardando dados";
      estadoEl.className = "estado";
    }
    atualizar();
  </script>
</body>
</html>
